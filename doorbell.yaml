substitutions:
  name: "doorbell"
  friendly_name: "CustomDoorBell"
  ota_password: "CHANGE_ME_BEFORE_FLASHING"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: "custom.doorbell"
    version: "4.2"

  on_boot:
    priority: -100
    then:
      - light.turn_on: backlight
      - delay: 100ms
      - lvgl.page.show: { id: page_boot, animation: NONE }
      - delay: 2s
      - lvgl.page.show: { id: page_idle, animation: FADE_IN }
      - delay: 500ms
      - light.turn_off: backlight

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  flash_size: 16MB

psram:
  mode: octal
  speed: 80MHz

# ─────────────────────────────────────────────────────────────────
# NETZWERK: W5500 Ethernet
# ─────────────────────────────────────────────────────────────────
ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9

# ─────────────────────────────────────────────────────────────────
# OTA & LOGGING
# ─────────────────────────────────────────────────────────────────
ota:
  - platform: esphome
    password: ${ota_password}

logger:
  level: DEBUG

# ─────────────────────────────────────────────────────────────────
# HOME ASSISTANT API SERVICES
# ─────────────────────────────────────────────────────────────────
api:
  services:
    - service: set_idle
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_grant
        - script.stop: timed_deny
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_bell),  NULL);
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_deny),  NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(icon_package), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
        - lvgl.page.show: { id: page_idle, animation: NONE }
        - light.turn_off: backlight

    - service: show_welcome
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_grant
        - script.stop: timed_deny
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_bell),  NULL);
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_deny),  NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(icon_package), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
        - light.turn_on: backlight
        - lvgl.page.show: { id: page_welcome, animation: NONE }

    - service: trigger_doorbell
      then:
        - script.stop: timed_grant
        - script.stop: timed_deny
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_deny),  NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(icon_package), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
        - light.turn_on: backlight
        - script.execute: timed_doorbell

    - service: show_processing
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_grant
        - script.stop: timed_deny
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_bell),  NULL);
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_deny),  NULL);
            lv_anim_del(id(icon_package), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
        - light.turn_on: backlight
        - lvgl.page.show: { id: page_processing, animation: NONE }
        - lambda: |-
            lv_obj_t *obj = id(icon_process);
            lv_anim_del(obj, NULL);
            lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
            lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
            lv_anim_t a; lv_anim_init(&a);
            lv_anim_set_var(&a, obj);
            lv_anim_set_values(&a, 256, 290);
            lv_anim_set_time(&a, 700);
            lv_anim_set_reverse_time(&a, 700);
            lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
            lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
                lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
                lv_obj_invalidate((lv_obj_t *)obj);
            });
            lv_anim_start(&a);
        - script.execute: timed_processing_watchdog

    - service: show_access_granted
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_deny
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_bell), NULL);
            lv_anim_del(id(icon_deny), NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(icon_package), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
        - light.turn_on: backlight
        - script.execute: timed_grant

    - service: show_access_denied
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_grant
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_bell),  NULL);
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(icon_package), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
        - light.turn_on: backlight
        - script.execute: timed_deny

    - service: show_package
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_grant
        - script.stop: timed_deny
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_bell),  NULL);
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_deny),  NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
        - light.turn_on: backlight
        - lvgl.page.show: { id: page_package, animation: NONE }
        # Pop-In Animation (Overshoot)
        - lambda: |-
            lv_obj_t *obj = id(icon_package);
            lv_anim_del(obj, NULL);
            lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
            lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
            lv_anim_t a; lv_anim_init(&a);
            lv_anim_set_var(&a, obj);
            lv_anim_set_values(&a, 10, 256);
            lv_anim_set_time(&a, 600);
            lv_anim_set_path_cb(&a, lv_anim_path_overshoot);
            lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
                lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
                lv_obj_invalidate((lv_obj_t *)obj);
            });
            lv_anim_start(&a);

    - service: show_custom
      variables:
        message: string
        icon: string
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_grant
        - script.stop: timed_deny
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_bell),  NULL);
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_deny),  NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(icon_package), NULL);
            const char* icon_str = "\U0000E887"; 
            if      (icon == "warnung") icon_str = "\U0000E002";
            else if (icon == "herz")    icon_str = "\U0000E87D";
            else if (icon == "haus")    icon_str = "\U0000E88A";
            else if (icon == "muell")   icon_str = "\U0000E15B";
            lv_label_set_text(id(lbl_custom_icon), icon_str);
            lv_label_set_text(id(lbl_custom_text), message.c_str());
        - light.turn_on: backlight
        - lvgl.page.show: { id: page_custom, animation: NONE }
        # Pop-In Animation für das Custom Icon
        - lambda: |-
            lv_obj_t *obj = id(lbl_custom_icon);
            lv_anim_del(obj, NULL);
            lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
            lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
            lv_anim_t a; lv_anim_init(&a);
            lv_anim_set_var(&a, obj);
            lv_anim_set_values(&a, 10, 256);
            lv_anim_set_time(&a, 600);
            lv_anim_set_path_cb(&a, lv_anim_path_overshoot);
            lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
                lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
                lv_obj_invalidate((lv_obj_t *)obj);
            });
            lv_anim_start(&a);

    - service: run_demo
      then:
        - script.execute: demo_loop

# ─────────────────────────────────────────────────────────────────
# SCRIPTS: Timed animations
# ─────────────────────────────────────────────────────────────────
script:
  - id: timed_doorbell
    mode: restart
    then:
      - lvgl.page.show: { id: page_ringing, animation: NONE }
      - delay: 100ms
      - lambda: |-
          lv_obj_t *obj = id(icon_bell);
          lv_anim_del(obj, NULL);
          lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
          lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, 256, 295);
          lv_anim_set_time(&a, 700);
          lv_anim_set_reverse_time(&a, 700);
          lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
              lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
              lv_obj_invalidate((lv_obj_t *)obj);
          });
          lv_anim_start(&a);
      - delay: 15s
      - lambda: |-
          lv_anim_del(id(icon_bell), NULL);
          lv_obj_set_style_transform_zoom(id(icon_bell), 256, 0);
      - lvgl.page.show: { id: page_welcome, animation: FADE_IN }

  - id: timed_grant
    mode: restart
    then:
      - lvgl.page.show: { id: page_grant, animation: NONE }
      - delay: 100ms
      - lambda: |-
          lv_obj_t *obj = id(icon_grant);
          lv_anim_del(obj, NULL);
          lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
          lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, 256, 275);
          lv_anim_set_time(&a, 500);
          lv_anim_set_reverse_time(&a, 500);
          lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
              lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
              lv_obj_invalidate((lv_obj_t *)obj);
          });
          lv_anim_start(&a);
      - delay: 5s
      - lambda: |-
          lv_anim_del(id(icon_grant), NULL);
          lv_obj_set_style_transform_zoom(id(icon_grant), 256, 0);
      - lvgl.page.show: { id: page_welcome, animation: FADE_IN }

  - id: timed_deny
    mode: restart
    then:
      - lvgl.page.show: { id: page_deny, animation: NONE }
      - delay: 100ms
      - lambda: |-
          lv_obj_t *obj = id(icon_deny);
          lv_anim_del(obj, NULL);
          lv_obj_set_style_translate_x(obj, 0, 0); // Reset position
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, -15, 15); // Shake amplitude
          lv_anim_set_time(&a, 60);        // Speed of shake
          lv_anim_set_reverse_time(&a, 60);
          lv_anim_set_repeat_count(&a, 8); // Number of shakes
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
              lv_obj_set_style_translate_x((lv_obj_t *)obj, val, 0);
              lv_obj_invalidate((lv_obj_t *)obj);
          });
          // Ensure it resets to center when animation ends
          lv_anim_set_ready_cb(&a, [](lv_anim_t *a) {
              lv_obj_set_style_translate_x((lv_obj_t *)a->var, 0, 0);
              lv_obj_invalidate((lv_obj_t *)a->var);
          });
          lv_anim_start(&a);
      - delay: 5s
      - lambda: |-
          lv_anim_del(id(icon_deny), NULL);
          lv_obj_set_style_translate_x(id(icon_deny), 0, 0);
      - lvgl.page.show: { id: page_welcome, animation: FADE_IN }

  # Watchdog für den Processing-Zustand.
  # Startet bei jedem Fingerabdruck-Scan. Wenn HA innerhalb von 8s
  # nicht mit show_access_granted oder show_access_denied antwortet
  # (HA offline, Netzwerk weg), zeigt der Nutzer ein Fehler-Feedback.
  # Idle-Timeout nach Präsenz-Ende.
  # Startet wenn Person den Eingang verlässt (LD2410 on_release).
  # Geht nur in Idle wenn kein aktiver Zustand läuft (Klingel etc.)
  - id: presence_idle_timeout
    mode: restart
    then:
      - delay: 30s
      - if:
          condition:
            lambda: |-
              return !id(timed_doorbell).is_running() &&
                     !id(timed_grant).is_running() &&
                     !id(timed_deny).is_running();
          then:
            - lvgl.page.show: { id: page_idle, animation: FADE_IN }
            - light.turn_off: backlight

  - id: timed_processing_watchdog
    mode: restart
    then:
      - delay: 8s
      - lambda: |-
          lv_anim_del(id(icon_process), NULL);
          lv_obj_set_style_transform_zoom(id(icon_process), 256, 0);
      - lvgl.page.show: { id: page_error, animation: NONE }
      - delay: 5s
      - lvgl.page.show: { id: page_idle, animation: FADE_IN }
      - light.turn_off: backlight

  - id: demo_loop
    mode: restart
    then:
      - light.turn_on: backlight
      - lvgl.page.show: { id: page_welcome, animation: NONE }
      - delay: 3s
      - homeassistant.service:
          service: esphome.doorbell_trigger_doorbell
      - delay: 5s
      - homeassistant.service:
          service: esphome.doorbell_show_processing
      - delay: 3s
      - homeassistant.service:
          service: esphome.doorbell_show_access_granted
      - delay: 6s
      - homeassistant.service:
          service: esphome.doorbell_show_access_denied
      - delay: 6s
      - homeassistant.service:
          service: esphome.doorbell_show_package
      - delay: 4s
      - homeassistant.service:
          service: esphome.doorbell_show_custom
          data:
            icon: "muell"
            message: "Müll raus!"
      - delay: 4s
      - homeassistant.service:
          service: esphome.doorbell_set_idle

# ─────────────────────────────────────────────────────────────────
# BUS-SYSTEME & SENSOREN
# ─────────────────────────────────────────────────────────────────
i2c:
  id: i2c_bus
  sda: GPIO4
  scl: GPIO5
  scan: true

uart:
  # Fingerabdruck-Scanner Grow R503
  - id: uart_finger
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 57600

  # LD2410 mmWave Präsenzsensor (hinter Acrylglas)
  - id: uart_ld2410
    tx_pin: GPIO21
    rx_pin: GPIO18
    baud_rate: 256000

pn532_i2c:
  id: nfc_reader
  update_interval: 1s
  on_tag:
    then:
      - homeassistant.event:
          event: esphome.access_nfc_scan
          data:
            uid: !lambda 'return x;'

fingerprint_grow:
  id: fingerprint_reader
  uart_id: uart_finger
  on_finger_scan_matched:
    - script.stop: timed_doorbell
    - script.stop: timed_grant
    - script.stop: timed_deny
    - lambda: |-
        lv_anim_del(id(icon_bell),  NULL);
        lv_anim_del(id(icon_grant), NULL);
        lv_anim_del(id(icon_deny),  NULL);
        lv_anim_del(id(icon_package), NULL);
        lv_anim_del(id(lbl_custom_icon), NULL);
    - lvgl.page.show: { id: page_processing, animation: NONE }
    - light.turn_on: backlight
    - lambda: |-
        lv_obj_t *obj = id(icon_process);
        lv_anim_del(obj, NULL);
        lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
        lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
        lv_anim_t a; lv_anim_init(&a);
        lv_anim_set_var(&a, obj);
        lv_anim_set_values(&a, 256, 290);
        lv_anim_set_time(&a, 700);
        lv_anim_set_reverse_time(&a, 700);
        lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
        lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
            lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
            lv_obj_invalidate((lv_obj_t *)obj);
        });
        lv_anim_start(&a);
    - script.execute: timed_processing_watchdog
    - homeassistant.event:
        event: esphome.access_finger_scan
        data:
          finger_id:  !lambda 'return to_string(finger_id);'
          confidence: !lambda 'return to_string(confidence);'
  on_finger_scan_unmatched:
    - script.stop: timed_doorbell
    - script.stop: timed_grant
    - script.stop: timed_processing_watchdog
    - lambda: |-
        lv_anim_del(id(icon_bell),  NULL);
        lv_anim_del(id(icon_grant), NULL);
    - script.execute: timed_deny

# ─────────────────────────────────────────────────────────────────
# PRÄSENZSENSOR: LD2410 mmWave (GPIO18/21, hinter Acrylglas)
# ─────────────────────────────────────────────────────────────────
ld2410:
  id: ld2410_sensor
  uart_id: uart_ld2410

binary_sensor:
  - platform: ld2410
    has_target:
      id: presence_at_door
      name: "Präsenz Eingang"
      device_class: presence
      on_press:
        then:
          # Idle-Timeout stoppen — Person ist da
          - script.stop: presence_idle_timeout
          # Welcome nur zeigen wenn kein wichtiger Zustand aktiv ist
          # (Klingeln, Processing, Grant, Deny laufen weiter)
          - if:
              condition:
                lambda: |-
                  return !id(timed_doorbell).is_running() &&
                         !id(timed_grant).is_running() &&
                         !id(timed_deny).is_running() &&
                         !id(timed_processing_watchdog).is_running();
              then:
                - light.turn_on: backlight
                - lvgl.page.show: { id: page_welcome, animation: NONE }
          - homeassistant.event:
              event: esphome.presence_detected
              data: {}
      on_release:
        then:
          # Person weg → Timeout starten, dann Idle
          - script.execute: presence_idle_timeout
          - homeassistant.event:
              event: esphome.presence_cleared
              data: {}
    has_moving_target:
      name: "Bewegung Eingang"
    has_still_target:
      name: "Stille Präsenz Eingang"

sensor:
  - platform: ld2410
    moving_distance:
      name: "LD2410 Abstand Bewegung"
    still_distance:
      name: "LD2410 Abstand Stillstand"
    detection_distance:
      name: "LD2410 Erkennungsabstand"

# ─────────────────────────────────────────────────────────────────
# DISPLAY & HARDWARE
# ─────────────────────────────────────────────────────────────────
output:
  - platform: gpio
    pin: GPIO42
    id: display_backlight_gpio

light:
  - platform: binary
    output: display_backlight_gpio
    id: backlight
    name: "Display Backlight"
    restore_mode: ALWAYS_OFF

spi:
  - id: spi_display
    clk_pin: GPIO36
    mosi_pin: GPIO35

display:
  - platform: st7789v
    id: main_display
    spi_id: spi_display
    model: GENERIC_170X320
    cs_pin: GPIO37
    dc_pin: GPIO39
    reset_pin: GPIO40
    rotation: 90
    update_interval: 16ms
    auto_clear_enabled: false

# ─────────────────────────────────────────────────────────────────
# FONTS
# ─────────────────────────────────────────────────────────────────
font:
  - file: "gfonts://Montserrat@700"
    id: font_huge_bold
    size: 40
    extras:
      - file: "gfonts://Montserrat@700"
        glyphs: "äöüÄÖÜß"
  - file: "gfonts://Montserrat"
    id: font_large
    size: 26
    extras:
      - file: "gfonts://Montserrat"
        glyphs: "äöüÄÖÜß"
  - file: "gfonts://Montserrat"
    id: font_medium
    size: 20
    extras:
      - file: "gfonts://Montserrat"
        glyphs: "äöüÄÖÜß"
  - file: "gfonts://Material Icons"
    id: font_icons
    size: 55
    glyphs:
      - "\U0000EF64"  # check_circle   (Zutritt)
      - "\U0000E5C9"  # cancel         (Verweigert)
      - "\U0000E58F"  # local_shipping (Paket)
      - "\U0000E7F4"  # notifications  (Klingel)
      - "\U0000E887"  # info           (Custom default)
      - "\U0000E002"  # warning        (Warnung)
      - "\U0000E87D"  # favorite       (Herz)
      - "\U0000E88A"  # home           (Haus)
      - "\U0000E15B"  # delete         (Müll)
      - "\U0000E90D"  # fingerprint    (Verarbeitung)

# ─────────────────────────────────────────────────────────────────
# LVGL: Display-Seiten & Styles
# ─────────────────────────────────────────────────────────────────
lvgl:
  displays:
    - main_display
  buffer_size: 25%

  style_definitions:
    - id: base_style
      border_width: 0
      radius: 0
      pad_all: 0
      bg_opa: COVER
      bg_color: 0x000000
    
    - id: card_style
      radius: 12
      border_width: 2
      bg_opa: COVER

  pages:
    # ── IDLE ─────────────────────────────────────────────────────
    - id: page_idle
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: [base_style]

    # ── BOOT ─────────────────────────────────────────────────────
    - id: page_boot
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: [base_style]
            widgets:
              - label:
                  text: "System Start"
                  text_font: font_medium
                  align: CENTER
                  text_color: 0x666666

    # ── WILLKOMMEN ────────────────────────────────────────────────
    - id: page_welcome
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: [base_style]
            widgets:
              - obj:
                  width: 304
                  height: 154
                  align: CENTER
                  styles: [card_style]
                  bg_color: 0x0A0A0A
                  border_color: 0x333333
                  widgets:
                    - label:
                        text: "Willkommen bei"
                        text_font: font_large
                        align: CENTER
                        y: -32
                        text_color: 0xAAAAAA
                    - obj:
                        width: 180
                        height: 2
                        align: CENTER
