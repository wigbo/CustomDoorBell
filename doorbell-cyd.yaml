# ═══════════════════════════════════════════════════════════════════
# CustomDoorBell — Cheap Yellow Display (ESP32-2432S028)
# GUI-Test-Port: ILI9341 320×240, kein Ethernet, kein Fingerprint
#
# Hardware:
#   Display:    ILI9341 320×240 SPI
#               CLK=GPIO14  MOSI=GPIO13  CS=GPIO15  DC=GPIO2
#               Backlight=GPIO21
#   Board:      ESP32-2432S028 (CYD), 4MB Flash, kein PSRAM
#
# Zweck: GUI-Validierung aller Screens und Animationen vor dem
#        ersten Flash der echten Doorbell-Hardware.
# ═══════════════════════════════════════════════════════════════════

substitutions:
  name: "doorbell-cyd"
  friendly_name: "DoorBell CYD Test"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

  on_boot:
    priority: -100
    then:
      - light.turn_on: backlight
      - delay: 100ms
      - lvgl.page.show: { id: page_boot, animation: NONE }
      - delay: 2s
      - script.execute: demo_loop

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ─────────────────────────────────────────────────────────────────
# NETZWERK: WiFi (kein Ethernet auf CYD)
# ─────────────────────────────────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "DoorBell-CYD-Test"
    password: "test1234"

captive_portal:

# ─────────────────────────────────────────────────────────────────
# GLOBALS
# ─────────────────────────────────────────────────────────────────
globals:
  - id: custom_timeout_s
    type: int
    initial_value: '10'

# ─────────────────────────────────────────────────────────────────
# HOME ASSISTANT API & OTA
# ─────────────────────────────────────────────────────────────────
api:
  services:
    - service: set_idle
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_grant
        - script.stop: timed_deny
        - script.stop: timed_custom
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_bell),  NULL);
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_deny),  NULL);
            lv_anim_del(id(card_deny),  NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(icon_package), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
            lv_obj_set_style_bg_color(id(card_deny), lv_color_hex(0x382525), 0);
        - lvgl.page.show: { id: page_idle, animation: NONE }
        - light.turn_off: backlight

    - service: show_welcome
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_grant
        - script.stop: timed_deny
        - script.stop: timed_custom
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_bell),  NULL);
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_deny),  NULL);
            lv_anim_del(id(card_deny),  NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(icon_package), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
            lv_obj_set_style_bg_color(id(card_deny), lv_color_hex(0x382525), 0);
        - light.turn_on: backlight
        - lvgl.page.show: { id: page_welcome, animation: NONE }

    - service: trigger_doorbell
      then:
        - script.stop: timed_grant
        - script.stop: timed_deny
        - script.stop: timed_custom
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_deny),  NULL);
            lv_anim_del(id(card_deny),  NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(icon_package), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
            lv_obj_set_style_bg_color(id(card_deny), lv_color_hex(0x382525), 0);
        - light.turn_on: backlight
        - script.execute: timed_doorbell

    - service: show_processing
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_grant
        - script.stop: timed_deny
        - script.stop: timed_custom
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_bell),  NULL);
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_deny),  NULL);
            lv_anim_del(id(card_deny),  NULL);
            lv_anim_del(id(icon_package), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
            lv_obj_set_style_bg_color(id(card_deny), lv_color_hex(0x382525), 0);
        - light.turn_on: backlight
        - lvgl.page.show: { id: page_processing, animation: NONE }
        - lambda: |-
            lv_obj_t *obj = id(icon_process);
            lv_anim_del(obj, NULL);
            lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
            lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
            lv_anim_t a; lv_anim_init(&a);
            lv_anim_set_var(&a, obj);
            lv_anim_set_values(&a, 256, 290);
            lv_anim_set_time(&a, 700);
            lv_anim_set_reverse_time(&a, 700);
            lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
            lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
                lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
                lv_obj_invalidate((lv_obj_t *)obj);
            });
            lv_anim_start(&a);
        - script.execute: timed_processing_watchdog

    - service: show_access_granted
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_deny
        - script.stop: timed_custom
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_bell),  NULL);
            lv_anim_del(id(icon_deny),  NULL);
            lv_anim_del(id(card_deny),  NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(icon_package), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
            lv_obj_set_style_bg_color(id(card_deny), lv_color_hex(0x382525), 0);
        - light.turn_on: backlight
        - script.execute: timed_grant

    - service: show_access_denied
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_grant
        - script.stop: timed_custom
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_bell),  NULL);
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(icon_package), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
        - light.turn_on: backlight
        - script.execute: timed_deny

    - service: show_package
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_grant
        - script.stop: timed_deny
        - script.stop: timed_custom
        - script.stop: timed_processing_watchdog
        - lambda: |-
            lv_anim_del(id(icon_bell),  NULL);
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_deny),  NULL);
            lv_anim_del(id(card_deny),  NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(lbl_custom_icon), NULL);
            lv_obj_set_style_bg_color(id(card_deny), lv_color_hex(0x382525), 0);
        - light.turn_on: backlight
        - lvgl.page.show: { id: page_package, animation: NONE }
        - lambda: |-
            lv_obj_t *obj = id(icon_package);
            lv_anim_del(obj, NULL);
            lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
            lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
            lv_anim_t a; lv_anim_init(&a);
            lv_anim_set_var(&a, obj);
            lv_anim_set_values(&a, 10, 256);
            lv_anim_set_time(&a, 600);
            lv_anim_set_path_cb(&a, lv_anim_path_overshoot);
            lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
                lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
                lv_obj_invalidate((lv_obj_t *)obj);
            });
            lv_anim_start(&a);

    - service: show_custom
      variables:
        message: string
        icon: string
        duration: int
      then:
        - script.stop: timed_doorbell
        - script.stop: timed_grant
        - script.stop: timed_deny
        - script.stop: timed_custom
        - script.stop: timed_processing_watchdog
        - globals.set:
            id: custom_timeout_s
            value: !lambda "return duration;"
        - lambda: |-
            lv_anim_del(id(icon_bell),  NULL);
            lv_anim_del(id(icon_grant), NULL);
            lv_anim_del(id(icon_deny),  NULL);
            lv_anim_del(id(card_deny),  NULL);
            lv_anim_del(id(icon_process), NULL);
            lv_anim_del(id(icon_package), NULL);
            lv_obj_set_style_bg_color(id(card_deny), lv_color_hex(0x382525), 0);
            const char* icon_str = "\U0000E887";
            if      (icon == "warnung") icon_str = "\U0000E002";
            else if (icon == "herz")    icon_str = "\U0000E87D";
            else if (icon == "haus")    icon_str = "\U0000E88A";
            else if (icon == "muell")   icon_str = "\U0000E15B";
            lv_label_set_text(id(lbl_custom_icon), icon_str);
            lv_label_set_text(id(lbl_custom_text), message.c_str());
        - light.turn_on: backlight
        - script.execute: timed_custom

    - service: run_demo
      then:
        - script.execute: demo_loop

ota:
  - platform: esphome

logger:
  level: DEBUG

# ─────────────────────────────────────────────────────────────────
# SCRIPTS
# ─────────────────────────────────────────────────────────────────
script:
  - id: timed_doorbell
    mode: restart
    then:
      - lvgl.page.show: { id: page_ringing, animation: NONE }
      - delay: 100ms
      - lambda: |-
          lv_obj_t *obj = id(icon_bell);
          lv_anim_del(obj, NULL);
          lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
          lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, 256, 295);
          lv_anim_set_time(&a, 700);
          lv_anim_set_reverse_time(&a, 700);
          lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
              lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
              lv_obj_invalidate((lv_obj_t *)obj);
          });
          lv_anim_start(&a);
      - delay: 15s
      - lambda: |-
          lv_anim_del(id(icon_bell), NULL);
          lv_obj_set_style_transform_zoom(id(icon_bell), 256, 0);
      - lvgl.page.show: { id: page_welcome, animation: FADE_IN }

  - id: timed_grant
    mode: restart
    then:
      - lvgl.page.show: { id: page_grant, animation: NONE }
      - delay: 100ms
      - lambda: |-
          lv_obj_t *obj = id(icon_grant);
          lv_anim_del(obj, NULL);
          lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
          lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, 256, 275);
          lv_anim_set_time(&a, 500);
          lv_anim_set_reverse_time(&a, 500);
          lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
              lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
              lv_obj_invalidate((lv_obj_t *)obj);
          });
          lv_anim_start(&a);
      - delay: 5s
      - lambda: |-
          lv_anim_del(id(icon_grant), NULL);
          lv_obj_set_style_transform_zoom(id(icon_grant), 256, 0);
      - lvgl.page.show: { id: page_welcome, animation: FADE_IN }

  - id: timed_deny
    mode: restart
    then:
      - lvgl.page.show: { id: page_deny, animation: NONE }
      - delay: 100ms
      - lambda: |-
          // Icon Shake
          lv_obj_t *obj = id(icon_deny);
          lv_anim_del(obj, NULL);
          lv_obj_set_style_translate_x(obj, 0, 0);
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, -15, 15);
          lv_anim_set_time(&a, 60);
          lv_anim_set_reverse_time(&a, 60);
          lv_anim_set_repeat_count(&a, 8);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
              lv_obj_set_style_translate_x((lv_obj_t *)obj, val, 0);
              lv_obj_invalidate((lv_obj_t *)obj);
          });
          lv_anim_set_ready_cb(&a, [](lv_anim_t *a) {
              lv_obj_set_style_translate_x((lv_obj_t *)a->var, 0, 0);
              lv_obj_invalidate((lv_obj_t *)a->var);
          });
          lv_anim_start(&a);

          // Kachel Flash (BGR: 0xFF1744 → 0x4417FF, Karte: 0x382525)
          lv_obj_t *card = id(card_deny);
          lv_anim_del(card, NULL);
          lv_anim_t a2; lv_anim_init(&a2);
          lv_anim_set_var(&a2, card);
          lv_anim_set_values(&a2, 0, 255);
          lv_anim_set_time(&a2, 250);
          lv_anim_set_reverse_time(&a2, 250);
          lv_anim_set_repeat_count(&a2, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_exec_cb(&a2, [](void *obj, int32_t val) {
              lv_color_t c = lv_color_mix(lv_color_hex(0x4417FF), lv_color_hex(0x382525), val);
              lv_obj_set_style_bg_color((lv_obj_t *)obj, c, 0);
              lv_obj_invalidate((lv_obj_t *)obj);
          });
          lv_anim_start(&a2);
      - delay: 5s
      - lambda: |-
          lv_anim_del(id(icon_deny), NULL);
          lv_anim_del(id(card_deny), NULL);
          lv_obj_set_style_translate_x(id(icon_deny), 0, 0);
          lv_obj_set_style_bg_color(id(card_deny), lv_color_hex(0x382525), 0);
      - lvgl.page.show: { id: page_welcome, animation: FADE_IN }

  - id: timed_custom
    mode: restart
    then:
      - lvgl.page.show: { id: page_custom, animation: NONE }
      - delay: 100ms
      - lambda: |-
          lv_obj_t *obj = id(lbl_custom_icon);
          lv_anim_del(obj, NULL);
          lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
          lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, 256, 320);
          lv_anim_set_time(&a, 800);
          lv_anim_set_reverse_time(&a, 800);
          lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
              lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
              lv_obj_invalidate((lv_obj_t *)obj);
          });
          lv_anim_start(&a);
      - delay: !lambda "return id(custom_timeout_s) * 1000;"
      - lambda: |-
          lv_anim_del(id(lbl_custom_icon), NULL);
          lv_obj_set_style_transform_zoom(id(lbl_custom_icon), 256, 0);
      - lvgl.page.show: { id: page_welcome, animation: FADE_IN }

  - id: timed_processing_watchdog
    mode: restart
    then:
      - delay: 8s
      - lambda: |-
          lv_anim_del(id(icon_process), NULL);
          lv_obj_set_style_transform_zoom(id(icon_process), 256, 0);
      - lvgl.page.show: { id: page_error, animation: NONE }
      - delay: 5s
      - lvgl.page.show: { id: page_idle, animation: FADE_IN }
      - light.turn_off: backlight

  # Demo-Loop: alle Screens automatisch durchlaufen
  # Direkte Script-Aufrufe — kein HA nötig, standalone testbar
  - id: demo_loop
    mode: restart
    then:
      - light.turn_on: backlight
      - lvgl.page.show: { id: page_welcome, animation: NONE }
      - delay: 3s

      # Klingeln
      - lvgl.page.show: { id: page_ringing, animation: NONE }
      - delay: 100ms
      - lambda: |-
          lv_obj_t *obj = id(icon_bell);
          lv_anim_del(obj, NULL);
          lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
          lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, 256, 295);
          lv_anim_set_time(&a, 700);
          lv_anim_set_reverse_time(&a, 700);
          lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
              lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
              lv_obj_invalidate((lv_obj_t *)obj);
          });
          lv_anim_start(&a);
      - delay: 4s
      - lambda: |-
          lv_anim_del(id(icon_bell), NULL);
          lv_obj_set_style_transform_zoom(id(icon_bell), 256, 0);
      - lvgl.page.show: { id: page_welcome, animation: FADE_IN }
      - delay: 1s

      # Fingerprint Processing (Puls)
      - lvgl.page.show: { id: page_processing, animation: NONE }
      - lambda: |-
          lv_obj_t *obj = id(icon_process);
          lv_anim_del(obj, NULL);
          lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
          lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, 256, 290);
          lv_anim_set_time(&a, 700);
          lv_anim_set_reverse_time(&a, 700);
          lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
              lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
              lv_obj_invalidate((lv_obj_t *)obj);
          });
          lv_anim_start(&a);
      - delay: 3s
      - lambda: |-
          lv_anim_del(id(icon_process), NULL);
          lv_obj_set_style_transform_zoom(id(icon_process), 256, 0);

      # Zutritt gewährt
      - lvgl.page.show: { id: page_grant, animation: NONE }
      - delay: 100ms
      - lambda: |-
          lv_obj_t *obj = id(icon_grant);
          lv_anim_del(obj, NULL);
          lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
          lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, 256, 275);
          lv_anim_set_time(&a, 500);
          lv_anim_set_reverse_time(&a, 500);
          lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
              lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
              lv_obj_invalidate((lv_obj_t *)obj);
          });
          lv_anim_start(&a);
      - delay: 3s
      - lambda: |-
          lv_anim_del(id(icon_grant), NULL);
          lv_obj_set_style_transform_zoom(id(icon_grant), 256, 0);
      - lvgl.page.show: { id: page_welcome, animation: FADE_IN }
      - delay: 1s

      # Zutritt verweigert (Shake)
      - lvgl.page.show: { id: page_deny, animation: NONE }
      - delay: 100ms
      - lambda: |-
          lv_obj_t *obj = id(icon_deny);
          lv_anim_del(obj, NULL);
          lv_obj_set_style_translate_x(obj, 0, 0);
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, -15, 15);
          lv_anim_set_time(&a, 60);
          lv_anim_set_reverse_time(&a, 60);
          lv_anim_set_repeat_count(&a, 8);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
              lv_obj_set_style_translate_x((lv_obj_t *)obj, val, 0);
              lv_obj_invalidate((lv_obj_t *)obj);
          });
          lv_anim_set_ready_cb(&a, [](lv_anim_t *a) {
              lv_obj_set_style_translate_x((lv_obj_t *)a->var, 0, 0);
          });
          lv_anim_start(&a);
      - delay: 3s
      - lambda: |-
          lv_anim_del(id(icon_deny), NULL);
          lv_obj_set_style_translate_x(id(icon_deny), 0, 0);
      - lvgl.page.show: { id: page_welcome, animation: FADE_IN }
      - delay: 1s

      # Paket (Pop-In)
      - lvgl.page.show: { id: page_package, animation: NONE }
      - lambda: |-
          lv_obj_t *obj = id(icon_package);
          lv_anim_del(obj, NULL);
          lv_obj_set_style_transform_pivot_x(obj, LV_PCT(50), 0);
          lv_obj_set_style_transform_pivot_y(obj, LV_PCT(50), 0);
          lv_anim_t a; lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, 10, 256);
          lv_anim_set_time(&a, 600);
          lv_anim_set_path_cb(&a, lv_anim_path_overshoot);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t val) {
              lv_obj_set_style_transform_zoom((lv_obj_t *)obj, val, 0);
              lv_obj_invalidate((lv_obj_t *)obj);
          });
          lv_anim_start(&a);
      - delay: 3s

      # Custom Nachricht (Puls, 3s)
      - globals.set:
          id: custom_timeout_s
          value: "3"
      - lambda: |-
          lv_label_set_text(id(lbl_custom_icon), "\U0000E15B");
          lv_label_set_text(id(lbl_custom_text), "Müll raus!");
      - script.execute: timed_custom
      - delay: 4s

      # Timeout-Fehler
      - lvgl.page.show: { id: page_error, animation: NONE }
      - delay: 3s

      # Neustart
      - lvgl.page.show: { id: page_welcome, animation: FADE_IN }
      - delay: 5s
      - script.execute: demo_loop

# ─────────────────────────────────────────────────────────────────
# DISPLAY: ILI9341 320×240 (CYD)
# CLK=GPIO14  MOSI=GPIO13  CS=GPIO15  DC=GPIO2  BLK=GPIO21
# LVGL rotation: 90 → Landscape 320×240 (Software-Rotation via LVGL)
# ─────────────────────────────────────────────────────────────────
output:
  - platform: gpio
    pin: GPIO21
    id: display_backlight_gpio

light:
  - platform: binary
    output: display_backlight_gpio
    id: backlight
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

display:
  - platform: ili9xxx
    id: main_display
    model: ILI9341
    cs_pin: GPIO15
    dc_pin: GPIO2
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false

# ─────────────────────────────────────────────────────────────────
# FONTS (identisch mit doorbell.yaml)
# ─────────────────────────────────────────────────────────────────
font:
  - file: "gfonts://Montserrat@700"
    id: font_huge_bold
    size: 40
    extras:
      - file: "gfonts://Montserrat@700"
        glyphs: "äöüÄÖÜß"
  - file: "gfonts://Montserrat"
    id: font_large
    size: 26
    extras:
      - file: "gfonts://Montserrat"
        glyphs: "äöüÄÖÜß"
  - file: "gfonts://Montserrat"
    id: font_medium
    size: 20
    extras:
      - file: "gfonts://Montserrat"
        glyphs: "äöüÄÖÜß"
  - file: "gfonts://Material Icons"
    id: font_icons
    size: 55
    glyphs:
      - "\U0000EF64"  # check_circle   (Zutritt)
      - "\U0000E5C9"  # cancel         (Verweigert)
      - "\U0000E58F"  # local_shipping (Paket)
      - "\U0000E7F4"  # notifications  (Klingel)
      - "\U0000E887"  # info           (Custom default)
      - "\U0000E002"  # warning        (Warnung / Fehler)
      - "\U0000E87D"  # favorite       (Herz)
      - "\U0000E88A"  # home           (Haus)
      - "\U0000E15B"  # delete         (Müll)
      - "\U0000E90D"  # fingerprint    (Verarbeitung)

# ─────────────────────────────────────────────────────────────────
# LVGL: Display-Seiten — v5.0 Design
# Landscape 320×240 (rotation: 90 im lvgl-Block, wie Production)
# Karte 290×200: 15px Rand links/rechts, 20px Rand oben/unten
# Farben BGR-korrigiert für ILI9341 auf dem CYD
# ─────────────────────────────────────────────────────────────────
lvgl:
  displays:
    - main_display
  rotation: 90
  buffer_size: 25%

  style_definitions:
    - id: base_style
      border_width: 0
      radius: 0
      pad_all: 0
      bg_opa: COVER
      bg_color: 0x000000

    - id: card_style
      radius: 12
      border_width: 0
      bg_opa: COVER
      bg_color: 0x382525    # BGR: #252538 dunkel-navy
      pad_all: 0
      clip_corner: true

  pages:

    # ── IDLE ─────────────────────────────────────────────────────
    - id: page_idle
      scrollbar_mode: "off"
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: [base_style]
            scrollbar_mode: "off"

    # ── BOOT ─────────────────────────────────────────────────────
    - id: page_boot
      scrollbar_mode: "off"
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: [base_style]
            scrollbar_mode: "off"
            widgets:
              - label:
                  text: "System Start"
                  text_font: font_medium
                  align: CENTER
                  text_color: 0x666666

    # ── WILLKOMMEN ────────────────────────────────────────────────
    - id: page_welcome
      scrollbar_mode: "off"
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: [base_style]
            scrollbar_mode: "off"
            widgets:
              - obj:
                  width: 290
                  height: 200
                  align: CENTER
                  styles: [card_style]
                  widgets:
                    - obj:
                        width: 100%
                        height: 4
                        align: TOP_LEFT
                        x: 0
                        y: 0
                        bg_color: 0xC2577E
                        bg_grad_color: 0xFFE500
                        bg_grad_dir: HOR
                        border_width: 0
                        radius: 0
                        pad_all: 0
                    - label:
                        text: "Willkommen bei"
                        text_font: font_large
                        align: CENTER
                        y: -40
                        text_color: 0xAAAAAA
                    - obj:
                        width: 160
                        height: 2
                        align: CENTER
                        y: -8
                        bg_color: 0x1A1A1A
                        styles: [base_style]
                    - label:
                        text: "Familie Tulum"
                        text_font: font_huge_bold
                        align: CENTER
                        y: 20
                        text_color: 0xFFFFFF

    # ── KLINGELN ─────────────────────────────────────────────────
    - id: page_ringing
      scrollbar_mode: "off"
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: [base_style]
            scrollbar_mode: "off"
            widgets:
              - obj:
                  width: 290
                  height: 200
                  align: CENTER
                  styles: [card_style]
                  widgets:
                    - obj:
                        width: 100%
                        height: 4
                        align: TOP_LEFT
                        x: 0
                        y: 0
                        bg_color: 0xFFE500
                        bg_grad_color: 0xD57B3A
                        bg_grad_dir: HOR
                        border_width: 0
                        radius: 0
                        pad_all: 0
                    - label:
                        id: icon_bell
                        text: "\U0000E7F4"
                        text_font: font_icons
                        text_color: 0xFFE500
                        align: CENTER
                        y: -30
                    - label:
                        text: "Es klingelt"
                        text_font: font_large
                        text_color: 0xFFFFFF
                        align: CENTER
                        y: 35

    # ── VERARBEITUNG ──────────────────────────────────────────────
    - id: page_processing
      scrollbar_mode: "off"
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: [base_style]
            scrollbar_mode: "off"
            widgets:
              - obj:
                  width: 290
                  height: 200
                  align: CENTER
                  styles: [card_style]
                  widgets:
                    - obj:
                        width: 100%
                        height: 4
                        align: TOP_LEFT
                        x: 0
                        y: 0
                        bg_color: 0x3BEBFF
                        bg_grad_color: 0x0098FF
                        bg_grad_dir: HOR
                        border_width: 0
                        radius: 0
                        pad_all: 0
                    - label:
                        id: icon_process
                        text: "\U0000E90D"
                        text_font: font_icons
                        text_color: 0x3BEBFF
                        align: CENTER
                        y: -30
                    - label:
                        text: "Prüfe..."
                        text_font: font_huge_bold
                        text_color: 0xFFFFFF
                        align: CENTER
                        y: 35

    # ── ZUTRITT GEWÄHRT ──────────────────────────────────────────
    - id: page_grant
      scrollbar_mode: "off"
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: [base_style]
            scrollbar_mode: "off"
            widgets:
              - obj:
                  width: 290
                  height: 200
                  align: CENTER
                  styles: [card_style]
                  widgets:
                    - obj:
                        width: 100%
                        height: 4
                        align: TOP_LEFT
                        x: 0
                        y: 0
                        bg_color: 0x87FF00
                        bg_grad_color: 0xD4B800
                        bg_grad_dir: HOR
                        border_width: 0
                        radius: 0
                        pad_all: 0
                    - label:
                        id: icon_grant
                        text: "\U0000EF64"
                        text_font: font_icons
                        text_color: 0x87FF00
                        align: CENTER
                        y: -30
                    - label:
                        text: "Tür geöffnet"
                        text_font: font_large
                        text_color: 0xFFFFFF
                        align: CENTER
                        y: 35

    # ── ZUTRITT VERWEIGERT ───────────────────────────────────────
    - id: page_deny
      scrollbar_mode: "off"
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: [base_style]
            scrollbar_mode: "off"
            widgets:
              - obj:
                  id: card_deny
                  width: 290
                  height: 200
                  align: CENTER
                  styles: [card_style]
                  widgets:
                    - obj:
                        width: 100%
                        height: 4
                        align: TOP_LEFT
                        x: 0
                        y: 0
                        bg_color: 0x5252FF
                        bg_grad_color: 0x4417FF
                        bg_grad_dir: HOR
                        border_width: 0
                        radius: 0
                        pad_all: 0
                    - label:
                        id: icon_deny
                        text: "\U0000E5C9"
                        text_font: font_icons
                        text_color: 0x5252FF
                        align: CENTER
                        y: -30
                    - label:
                        text: "STOPP"
                        text_font: font_huge_bold
                        text_color: 0xFFFFFF
                        align: CENTER
                        y: 35

    # ── PAKET ─────────────────────────────────────────────────────
    - id: page_package
      scrollbar_mode: "off"
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
