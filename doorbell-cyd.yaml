                        bg_color: 0x00B3FF
                        bg_grad_color: 0x006DFF
                        bg_grad_dir: HOR
                        border_width: 0
                        radius: 0
                        pad_all: 0
                    - label:
                        id: icon_package
                        text: "\U0000E58F"
                        text_font: font_icons
                        text_color: 0x00B3FF
                        align: CENTER
                        y: -30
                    - label:
                        text: "PAKET"
                        text_font: font_huge_bold
                        text_color: 0xFFFFFF
                        align: CENTER
                        y: 35

    # ── CUSTOM ───────────────────────────────────────────────────
    - id: page_custom
      scrollbar_mode: "off"
      bg_color: 0x000000
      widgets:
